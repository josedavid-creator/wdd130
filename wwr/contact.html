<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Contact Amazon Rapids Rafting for questions, reservations, and information about our rafting adventures.">

    <meta name="author" content="Jose David Vera">

    <title>Contact Us | Amazon Rapids Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo_great.jpg" alt="Amazon Rapids Rafting logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="contact-page">

        <h1>Contact Us</h1>

        <section class="contact-info">

            <h2>Contact Information</h2>

            <p>
                <strong>Address:</strong>
                123 Amazon River Road, Manaus, Brazil
            </p>

            <p>
                <strong>Phone:</strong>
                +55 11 91 5353 833
            </p>

            <p>
                <strong>Email:</strong>
                info@amazonrapidsrafting.com
            </p>

        </section>

        <div class="map-section">

            <iframe src="https://www.google.com/maps?q=Manaus%2C%20Brazil&output=embed" width="600"
              height="300" loading="lazy" title="Map showing the location of Amazon Rapids Rafting">
            </iframe>

        </div>

        <section class="contact-form">

            <h2>Send Us a Message</h2>

            <form>

                <label for="name">Name</label>

                <input type="text" id="name" name="name" placeholder="Placeholder">

                <label for="email">Email</label>

                <input type="email" id="email" name="email" placeholder="Placeholder">

                <p>
                    Message<br>
                    Purpose
                </p>

                <div class="radio-options">

                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general">
                        General Inquiry
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>

                </div>

                <label for="message" class="message-label">
                    Message
                </label>

                <textarea id="message" name="message" rows="5" placeholder="Type here"></textarea>

                <label class="contact-newsletter" for="newsletter">

                    <input type="checkbox" id="newsletter" name="newsletter">

                    Please subscribe me to the monthly newsletter

                </label>

                <button type="submit">
                    Get in Touch!
                </button>

            </form>

        </section>

        <section class="employees">

            <h2>Meet Our Team</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="images/josee.jpg" alt="Rafting guide">
                    <figcaption>
                        Jose David - Lead Rafting Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/maria.jpg" alt="Rafting instructor">
                    <figcaption>
                        Maria - Safety Instructor
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/carlosss.avif" alt="Customer service representative">
                    <figcaption>
                        Carlos - Customer Service Manager
                    </figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>
            © 2026 Amazon Rapids Rafting | Jose David Vera
        </p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Instagram Icon">
            </a>

        </nav>

    </footer>

</body>

</html>
