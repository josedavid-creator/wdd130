<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Jose David Vera">

</head>

<body>
    <header>
        <img src="images/basic-logo.png" alt="Structure of page logo" width="128" height="128">

            <li><a href="https://www.mercadolivre.com.br/">ML brasil online</li>

    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Laudantium, natus?</p>
            </h2>
        </section>
        <section>
            <h2>
                <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Voluptas, molestiae.
                </p>
            </h2>
        </section>
    </main>
    <aside>
        <img
          src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/anchorage-alaska/800x450/anchorage-temple-lds-253274-wallpaper.jpg"

        <p>Jose David Vera</p>
